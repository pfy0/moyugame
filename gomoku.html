<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摸鱼五子棋</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: #1b1f27; color: #e8e8ea;
         font-family: "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
  .app { padding: 14px; }
  .title { text-align: center; font-size: 15px; letter-spacing: 6px; color: #8f9bab; margin-bottom: 10px; }
  .panel { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; margin-bottom: 10px; }
  .seg { display: flex; background: #262c37; border-radius: 9px; padding: 3px; }
  .seg button { background: transparent; color: #9aa6b8; border-radius: 7px; padding: 7px 12px; font-size: 14px; }
  .seg button.on { background: #3b82f6; color: #fff; }
  button { border: 0; border-radius: 9px; padding: 9px 14px; background: #2f3640; color: #dfe4ec;
           cursor: pointer; font-size: 14px; font-family: inherit; transition: background .15s, transform .1s; }
  button:hover { background: #3a4250; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #status { text-align: center; min-height: 26px; margin-bottom: 10px; font-size: 17px; color: #cdd6e2; }
  #status .win { color: #ffd54a; font-weight: 700; }
  #status .you { color: #6ee7a8; }
  #board { position: relative; width: min(94vw, min(62vh, 560px), 500px); aspect-ratio: 1;
           background: radial-gradient(120% 90% at 50% 0%, #fbe0ac, #e9b96f 70%, #dda85c);
           border-radius: 12px; box-shadow: 0 20px 55px #0008, inset 0 0 0 1px #fff4; touch-action: manipulation; cursor: pointer; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stones { position: absolute; inset: 0; pointer-events: none; }
  #hover { position: absolute; width: 6.6%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
           pointer-events: none; box-shadow: inset 0 0 0 2px #ffffff70; display: none; }
  .stone { position: absolute; width: 6.3%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
           pointer-events: none; animation: pop .12s ease-out; }
  .stone.black { background: radial-gradient(circle at 34% 28%, #6b7280, #1f2937 62%, #0b0f16); }
  .stone.white { background: radial-gradient(circle at 34% 28%, #ffffff, #e2e6ee 62%, #b9c0cc); }
  .stone.last { box-shadow: 0 0 0 3px #ff5252, 0 0 12px #ff525299; }
  .stone.win { box-shadow: 0 0 0 3px #ffd54a, 0 0 14px #ffd54a99; }
  @keyframes pop { from { transform: translate(-50%,-50%) scale(.4); opacity: .3; } to { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
  .hint { margin-top: 12px; text-align: center; font-size: 12px; color: #66707f; line-height: 1.7; }
</style>
</head>
<body>
<div class="app">
  <div class="title">摸 鱼 五 子 棋</div>
  <div class="panel">
    <div class="seg" id="mode">
      <button data-m="ai" class="on">人机</button>
      <button data-m="pvp">双人</button>
    </div>
    <div class="seg" id="side">
      <button data-s="black" class="on">执黑先行</button>
      <button data-s="white">执白后行</button>
    </div>
    <div class="seg" id="level">
      <button data-l="1">简单</button>
      <button data-l="2" class="on">普通</button>
      <button data-l="3">困难</button>
    </div>
    <button id="undo">悔棋</button>
    <button id="flip">翻转</button>
    <button id="new">重开</button>
  </div>
  <div id="status"></div>
  <div id="board"><canvas id="grid"></canvas><div id="hover"></div><div id="stones"></div></div>
  <div class="hint">点棋盘落子 &nbsp;·&nbsp; 人机模式下悔棋回退双方各一手 &nbsp;·&nbsp; 空格键重开，Ctrl+Z 悔棋</div>
</div>

<script>
(function(){
"use strict";

const SIZE = 15, EMPTY = 0, BLACK = 1, WHITE = 2;
const X0 = 100/30, DX = 100/15;          // 交叉点百分比坐标

const boardEl  = document.getElementById("board");
const canvas   = document.getElementById("grid");
const stonesEl = document.getElementById("stones");
const hoverEl  = document.getElementById("hover");
const statusEl = document.getElementById("status");

let grid, turn, moves, gameOver, winLine, thinking, flipped, timer, hoverCell;
let mode = "ai", humanSide = BLACK, level = 2;

const inb   = (r,c) => r>=0 && r<SIZE && c>=0 && c<SIZE;
const other = col => col===BLACK ? WHITE : BLACK;
const cellX = c => X0 + c*DX;
const cellY = r => X0 + r*DX;
const DIRS  = [[0,1],[1,0],[1,1],[1,-1]];

/* ---------- 棋型评分 ------------------------------------------------
   把落点周围 9 格拼成字符串（1=自己 0=对手/出界 .=空），
   按顺序取第一个命中的棋型作为该方向的分值。 */
const SHAPES = [
  [10000000, ["11111"]],                                       // 连五
  [0,        ["011110"]],                                      // 死四：两端皆堵，无威胁
  [1000000,  [".1111."]],                                      // 活四
  [100000,   ["1111","11110","01111","11011","10111","11101"]],// 冲四
  [10000,    [".111.",".11.1.",".1.11."]],                     // 活三
  [1000,     ["111","1101","1011",".111","111."]],             // 眠三
  [500,      [".11.",".1.1.","11..1","1..11"]],                // 活二
  [100,      ["11","1.1"]],
  [10,       ["1"]]
];

function windowStr(r,c,dr,dc,color){
  let s = "";
  for (let k=-4;k<=4;k++){
    if (k===0){ s += "1"; continue; }
    const nr = r+dr*k, nc = c+dc*k;
    if (!inb(nr,nc)){ s += "0"; continue; }
    const v = grid[nr][nc];
    s += v===EMPTY ? "." : (v===color ? "1" : "0");
  }
  return s;
}

function dirScore(r,c,dr,dc,color){
  const s = windowStr(r,c,dr,dc,color);
  for (let i=0;i<SHAPES.length;i++){
    const pats = SHAPES[i][1];
    for (let j=0;j<pats.length;j++) if (s.indexOf(pats[j]) >= 0) return SHAPES[i][0];
  }
  return 0;
}

// 最强方向的分 + 其余方向的一半（鼓励双威胁）
function pointScore(r,c,color){
  let total = 0, best = 0;
  for (let i=0;i<DIRS.length;i++){
    const v = dirScore(r,c,DIRS[i][0],DIRS[i][1],color);
    total += v;
    if (v > best) best = v;
  }
  return best + (total-best)*0.5;
}

function checkWin(r,c,color){
  for (let i=0;i<DIRS.length;i++){
    const dr = DIRS[i][0], dc = DIRS[i][1];
    const line = [[r,c]];
    for (let s=1;s<=4;s++){ const nr=r+dr*s, nc=c+dc*s; if (inb(nr,nc)&&grid[nr][nc]===color) line.push([nr,nc]); else break; }
    for (let s=1;s<=4;s++){ const nr=r-dr*s, nc=c-dc*s; if (inb(nr,nc)&&grid[nr][nc]===color) line.unshift([nr,nc]); else break; }
    if (line.length >= 5) return line;
  }
  return null;
}

function makesFive(r,c,color){
  if (!inb(r,c) || grid[r][c] !== EMPTY) return false;
  grid[r][c] = color;
  const w = checkWin(r,c,color);
  grid[r][c] = EMPTY;
  return !!w;
}

// 只考虑已有棋子周围 2 格以内的空点
function candidates(){
  let any = false;
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (grid[r][c]!==EMPTY){ any = true; break; }
  if (!any) return [[7,7]];
  const near = Array.from({length:SIZE}, () => Array(SIZE).fill(false));
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
    if (grid[r][c]===EMPTY) continue;
    for (let dr=-2;dr<=2;dr++) for (let dc=-2;dc<=2;dc++){
      const nr=r+dr, nc=c+dc;
      if (inb(nr,nc) && grid[nr][nc]===EMPTY) near[nr][nc] = true;
    }
  }
  const out = [];
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (near[r][c]) out.push([r,c]);
  return out;
}

/* ---------- 搜索式 AI -------------------------------------------------
   在棋型评分之上叠加 Alpha-Beta 搜索：算"我下这里、对手最佳回应"后的最坏
   结果，因此能识破活三/双三/双四等连环套路，而不再只看单点分。 */

const WIN_SCORE = 1e8;                    // 连五基准分，越早赢分越高

// 启发式排序分：自己的进攻 + 对手在此的威胁（分越高越先搜）
function moveOrder(r,c,color){
  return pointScore(r,c,color) + pointScore(r,c,other(color))*0.9;
}

// 全盘静态分：每枚棋子取四个方向的最高棋型分累加
function rawBoardScore(color){
  let s = 0;
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
    if (grid[r][c] !== color) continue;
    for (let i=0;i<DIRS.length;i++) s += dirScore(r,c,DIRS[i][0],DIRS[i][1],color);
  }
  return s;
}

// 叶节点评估：站在 aiColor 视角的净优势
function evaluateBoard(aiColor){
  return rawBoardScore(aiColor) - rawBoardScore(other(aiColor))*1.05;
}

// Alpha-Beta：color 为当前该下的一方，返回 aiColor 视角的分数
function search(color, depth, alpha, beta, aiColor){
  const cand = candidates();
  if (!cand.length) return 0;
  const maxing = color === aiColor;

  // 当前方能一步成五 → 立即胜（层数越浅说明赢得越快）
  for (let i=0;i<cand.length;i++)
    if (makesFive(cand[i][0],cand[i][1],color))
      return maxing ? (WIN_SCORE + depth) : -(WIN_SCORE + depth);

  if (depth <= 0) return evaluateBoard(aiColor);

  // 对手下一步就能成五时，本方只能去堵，其余点一律不必考虑
  const forced = [];
  for (let i=0;i<cand.length;i++){
    const p = cand[i];
    if (makesFive(p[0],p[1],other(color))) forced.push({ r:p[0], c:p[1] });
  }

  let moves;
  if (forced.length){
    moves = forced;
  } else {
    moves = cand.map(p => ({ r:p[0], c:p[1], s: moveOrder(p[0],p[1],color) }))
                .sort((a,b) => b.s - a.s)
                .slice(0, 12);
  }

  let best = maxing ? -Infinity : Infinity;
  for (let i=0;i<moves.length;i++){
    const m = moves[i];
    grid[m.r][m.c] = color;
    let v;
    if (checkWin(m.r,m.c,color)) v = maxing ? (WIN_SCORE + depth) : -(WIN_SCORE + depth);
    else v = search(other(color), depth-1, alpha, beta, aiColor);
    grid[m.r][m.c] = EMPTY;

    if (maxing){ if (v>best) best=v; if (best>alpha) alpha=best; }
    else       { if (v<best) best=v; if (best<beta)  beta =best; }
    if (beta <= alpha) break;
  }
  return best;
}

function aiChoose(){
  const ai = turn, hu = other(ai);
  const cand = candidates();
  if (!cand.length) return null;
  if (cand.length === 1) return { r:cand[0][0], c:cand[0][1], score: 0 };

  // 1) 自己一步成五，直接赢
  for (let i=0;i<cand.length;i++)
    if (makesFive(cand[i][0],cand[i][1],ai))
      return { r:cand[i][0], c:cand[i][1], score: Infinity };

  // 2) 对手一步成五，必须堵
  for (let i=0;i<cand.length;i++)
    if (makesFive(cand[i][0],cand[i][1],hu))
      return { r:cand[i][0], c:cand[i][1], score: 9000000 };

  // 简单：只看单点分并在前几名里随机，保留一定失误率
  if (level === 1){
    const scored = cand.map(p => ({ r:p[0], c:p[1], s: moveOrder(p[0],p[1],ai) }))
                       .sort((a,b) => b.s - a.s);
    const top = scored.slice(0, Math.min(6, scored.length));
    const pick = top[Math.floor(Math.random()*top.length)];
    return { r:pick.r, c:pick.c, score:pick.s };
  }

  // 普通/困难：Alpha-Beta 搜索，困难看得更深
  const depth = level === 3 ? 4 : 2;
  const root = cand.map(p => ({ r:p[0], c:p[1], s: moveOrder(p[0],p[1],ai) }))
                    .sort((a,b) => b.s - a.s)
                    .slice(0, level === 3 ? 12 : 10);

  let best = root[0], bestV = -Infinity, alpha = -Infinity;
  for (let i=0;i<root.length;i++){
    const m = root[i];
    grid[m.r][m.c] = ai;
    const v = checkWin(m.r,m.c,ai) ? WIN_SCORE : search(hu, depth-1, alpha, Infinity, ai);
    grid[m.r][m.c] = EMPTY;
    if (v > bestV){ bestV = v; best = m; }
    if (v > alpha) alpha = v;
  }
  return { r:best.r, c:best.c, score:bestV };
}

/* ---------- 渲染 ---------- */
function stoneEl(r,c,color,isLast){
  const el = document.createElement("div");
  el.className = "stone " + (color===BLACK ? "black" : "white") + (isLast ? " last" : "");
  el.style.left = cellX(c) + "%";
  el.style.top  = cellY(r) + "%";
  el.dataset.cell = r + "," + c;
  return el;
}

function clearLastMark(){
  const kids = stonesEl.children;
  for (let i=0;i<kids.length;i++) kids[i].classList.remove("last");
}

function renderAll(){
  stonesEl.innerHTML = "";
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
    if (grid[r][c] !== EMPTY){
      const isLast = moves.length>0 && moves[moves.length-1].r===r && moves[moves.length-1].c===c;
      stonesEl.appendChild(stoneEl(r,c,grid[r][c],isLast));
    }
  }
  if (winLine) markWin();
  drawGrid();
}

function markWin(){
  const kids = stonesEl.children;
  for (let i=0;i<kids.length;i++){
    const key = kids[i].dataset.cell;
    for (let j=0;j<winLine.length;j++){
      if (key === winLine[j][0] + "," + winLine[j][1]) kids[i].classList.add("win");
    }
  }
}

function drawGrid(){
  const g = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = boardEl.clientWidth || 480, h = boardEl.clientHeight || 480;
  canvas.width = w*dpr; canvas.height = h*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const x = i => cellX(i)/100*w;
  const y = i => cellY(i)/100*h;
  g.strokeStyle = "#7a4a13"; g.lineWidth = 1.1; g.lineCap = "round";
  for (let i=0;i<SIZE;i++){
    g.beginPath(); g.moveTo(x(0),y(i)); g.lineTo(x(SIZE-1),y(i)); g.stroke();
    g.beginPath(); g.moveTo(x(i),y(0)); g.lineTo(x(i),y(SIZE-1)); g.stroke();
  }
  g.fillStyle = "#7a4a13";
  const r0 = Math.max(2.5, w*0.009);
  [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(p => {
    g.beginPath(); g.arc(x(p[1]),y(p[0]),r0,0,Math.PI*2); g.fill();
  });
}


/* ---------- 交互 ---------- */
function pointToCell(clientX,clientY){
  const rect = boardEl.getBoundingClientRect();
  const px = (clientX-rect.left)/rect.width*100;
  const py = (clientY-rect.top)/rect.height*100;
  let dc = Math.round((px-X0)/DX), dr = Math.round((py-X0)/DX);
  if (dr<0||dr>=SIZE||dc<0||dc>=SIZE) return null;
  if (Math.abs(px-cellX(dc)) > DX*0.55) return null;
  if (Math.abs(py-cellY(dr)) > DX*0.55) return null;
  return flipped ? [SIZE-1-dr, SIZE-1-dc] : [dr, dc];
}

function canPlay(){
  return !gameOver && !thinking && (mode==="pvp" || turn===humanSide);
}

function place(r,c){
  if (gameOver || thinking) return false;
  if (!inb(r,c) || grid[r][c] !== EMPTY) return false;
  const color = turn;
  grid[r][c] = color;
  moves.push({r:r, c:c, color:color});
  clearLastMark();
  stonesEl.appendChild(stoneEl(r,c,color,true));
  hideHover();

  const w = checkWin(r,c,color);
  if (w){ gameOver = true; winLine = w; markWin(); updateStatus(); return true; }
  if (moves.length === SIZE*SIZE){ gameOver = true; updateStatus(); return true; }

  turn = other(color);
  updateStatus();
  maybeAI();
  return true;
}

function maybeAI(){
  clearTimeout(timer);
  if (gameOver || mode!=="ai" || turn===humanSide) return;
  thinking = true; updateStatus();
  timer = setTimeout(() => {
    const mv = aiChoose();
    thinking = false;
    if (!mv){ updateStatus(); return; }
    place(mv.r, mv.c);
  }, 180);
}

function updateStatus(){
  if (gameOver){
    if (winLine){
      const name = winLine[0] ? (grid[winLine[0][0]][winLine[0][1]]===BLACK ? "黑方" : "白方") : "";
      statusEl.innerHTML = "<span class=\"win\">" + name + "五子连珠，获胜！</span>";
    } else {
      statusEl.innerHTML = "<span class=\"win\">棋盘已满，平局</span>";
    }
    return;
  }
  let text = (turn===BLACK ? "黑方" : "白方") + "落子";
  if (mode==="ai") text += turn===humanSide ? "（轮到你）" : "（电脑思考中…）";
  statusEl.innerHTML = "<span class=\"you\">" + text + "</span>";
}

function showHover(r,c){
  const el = hoverEl;
  el.style.left = cellX(c) + "%";
  el.style.top  = cellY(r) + "%";
  el.style.display = "block";
  el.style.background = turn===BLACK ? "radial-gradient(circle at 34% 28%, #6b7280, #1f2937 62%, #0b0f16)"
                                      : "radial-gradient(circle at 34% 28%, #ffffff, #e2e6ee 62%, #b9c0cc)";
  el.style.opacity = "0.45";
}
function hideHover(){ hoverEl.style.display = "none"; }

function newGame(){
  clearTimeout(timer); thinking = false;
  grid = Array.from({length:SIZE}, () => Array(SIZE).fill(EMPTY));
  turn = BLACK; moves = []; gameOver = false; winLine = null; hoverCell = null;
  flipped = mode==="ai" && humanSide===WHITE;
  hideHover();
  renderAll(); updateStatus();
  maybeAI();
}

function undo(){
  clearTimeout(timer); thinking = false;
  if (!moves.length) return;
  let n = (mode==="ai" && moves.length>=2) ? 2 : 1;
  while (n--){
    const m = moves.pop();
    if (!m) break;
    grid[m.r][m.c] = EMPTY;
  }
  gameOver = false; winLine = null;
  turn = moves.length ? other(moves[moves.length-1].color) : BLACK;
  renderAll(); updateStatus();
  maybeAI();
}

function flip(){ flipped = !flipped; renderAll(); }

function setSeg(id, attr, value){
  const box = document.getElementById(id);
  const kids = box.children;
  for (let i=0;i<kids.length;i++) kids[i].classList.toggle("on", kids[i].getAttribute(attr)===value);
}

boardEl.addEventListener("click", ev => {
  if (!canPlay()) return;
  const cell = pointToCell(ev.clientX, ev.clientY);
  if (cell) place(cell[0], cell[1]);
});
boardEl.addEventListener("mousemove", ev => {
  if (!canPlay()){ hideHover(); return; }
  const cell = pointToCell(ev.clientX, ev.clientY);
  if (!cell || grid[cell[0]][cell[1]] !== EMPTY){ hideHover(); return; }
  showHover(cell[0], cell[1]);
});
boardEl.addEventListener("mouseleave", hideHover);

document.getElementById("mode").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.getAttribute("data-m"); setSeg("mode","data-m",mode); newGame();
});
document.getElementById("side").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  humanSide = b.getAttribute("data-s")==="white" ? WHITE : BLACK;
  setSeg("side","data-s", b.getAttribute("data-s")); newGame();
});
document.getElementById("level").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  level = Number(b.getAttribute("data-l")); setSeg("level","data-l",String(level));
});
document.getElementById("undo").addEventListener("click", undo);
document.getElementById("flip").addEventListener("click", flip);
document.getElementById("new").addEventListener("click", newGame);

document.addEventListener("keydown", e => {
  if (e.key===" "){ e.preventDefault(); newGame(); }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
});
window.addEventListener("resize", drawGrid);

// 调试/测试钩子（页面运行不受影响）
globalThis.__gomoku = {
  SIZE: SIZE, BLACK: BLACK, WHITE: WHITE,
  get grid(){ return grid; }, set grid(v){ grid = v; },
  get turn(){ return turn; }, set turn(v){ turn = v; },
  get moves(){ return moves; }, set moves(v){ moves = v; },
  get gameOver(){ return gameOver; }, set gameOver(v){ gameOver = v; },
  place: place, checkWin: checkWin, makesFive: makesFive,
  pointScore: pointScore, dirScore: dirScore, candidates: candidates,
  aiChoose: aiChoose, newGame: newGame, undo: undo,
  setLevel: function(l){ level = l; }, setMode: function(m){ mode = m; },
  setHuman: function(c){ humanSide = c; }
};

newGame();
})();
</script>
</body>
</html>
