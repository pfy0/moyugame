<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摸鱼象棋</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: #1b1f27; color: #e8e8ea;
         font-family: "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
  .app { padding: 14px; }
  .title { text-align: center; font-size: 15px; letter-spacing: 6px; color: #8f9bab; margin-bottom: 10px; }
  .panel { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; margin-bottom: 10px; }
  .seg { display: flex; background: #262c37; border-radius: 9px; padding: 3px; }
  .seg button { background: transparent; color: #9aa6b8; border-radius: 7px; padding: 7px 12px; font-size: 14px; }
  .seg button.on { background: #3b82f6; color: #fff; }
  button { border: 0; border-radius: 9px; padding: 9px 14px; background: #2f3640; color: #dfe4ec;
           cursor: pointer; font-size: 14px; font-family: inherit; transition: background .15s, transform .1s; }
  button:hover { background: #3a4250; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #status { text-align: center; min-height: 26px; margin-bottom: 10px; font-size: 17px; color: #cdd6e2; }
  #status .check { color: #ff7a7a; font-weight: 700; }
  #status .win { color: #ffd54a; font-weight: 700; }
  #board { position: relative; width: min(94vw, min(58vh, 560px), 470px); aspect-ratio: 9 / 10;
           background: radial-gradient(120% 90% at 50% 0%, #fbe0ac, #e9b96f 70%, #dda85c);
           border-radius: 12px; box-shadow: 0 20px 55px #0008, inset 0 0 0 1px #fff4; touch-action: manipulation; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #pieces { position: absolute; inset: 0; pointer-events: none; }
  .piece { position: absolute; width: 9.4%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
           display: grid; place-items: center; font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
           font-weight: 700; font-size: inherit; background: radial-gradient(circle at 34% 28%, #fffdf4, #e6c98d 72%, #d3b070);
           border: 2px solid #7c4a12; box-shadow: 0 3px 9px #0005, inset 0 0 0 3px #fff8;
           transition: left .16s ease, top .16s ease; cursor: pointer; pointer-events: none; }
  .piece::after { content: ''; position: absolute; inset: 12%; border-radius: 50%; border: 1px solid #0002; }
  .piece.red { color: #c81e1e; }
  .piece.black { color: #22303f; }
  .piece.sel { box-shadow: 0 0 0 3px #ffd54a, 0 0 14px #ffd54a99, 0 4px 12px #0007; z-index: 3; }
  .piece.last { outline: 3px dashed #2e6ff2aa; outline-offset: -9px; }
  .piece.dim { opacity: .55; }
  .dot { position: absolute; width: 5.6%; aspect-ratio: 1; border-radius: 50%; background: #2ecc71cc;
         border: 2px solid #fff; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 8px #0005; }
  .cap { position: absolute; width: 9%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #e0323233;
        transform: translate(-50%, -50%); pointer-events: none; }
</style>
</head>
<body>
<div class="app">
  <div class="title">摸 鱼 象 棋</div>
  <div class="panel">
    <div class="seg" id="mode">
      <button data-m="ai" class="on">人机</button>
      <button data-m="pvp">双人</button>
    </div>
    <div class="seg" id="side">
      <button data-s="red" class="on">执红</button>
      <button data-s="black">执黑</button>
    </div>
    <div class="seg" id="level">
      <button data-l="1">简单</button>
      <button data-l="2" class="on">普通</button>
      <button data-l="3">困难</button>
    </div>
    <button id="new">重开</button>
    <button id="undo">悔棋</button>
    <button id="flip">翻转</button>
  </div>
  <div id="status"></div>
  <div id="board"><canvas id="grid"></canvas><div id="pieces"></div></div>
  <div class="hint">点棋盘选子，点绿点落子 &nbsp;·&nbsp; 空格键重开，Ctrl+Z 悔棋</div>
</div>

<script>
(function(){
"use strict";

const R = "red", B = "black";
const NAMES = {
  red:   {k:"帥",a:"仕",e:"相",h:"馬",r:"車",c:"炮",p:"兵"},
  black: {k:"將",a:"士",e:"象",h:"馬",r:"車",c:"砲",p:"卒"}
};
const VALUES = {k:100000, r:900, c:430, h:400, e:170, a:160, p:70};
const MATE = 1000000;
const COLS = 9, ROWS = 10;
const X0 = 7.06, DX = 10.74, Y0 = 5.29, DY = 9.94;

const boardEl = document.getElementById("board");
const canvas = document.getElementById("grid");
const piecesEl = document.getElementById("pieces");
const statusEl = document.getElementById("status");
const undoBtn = document.getElementById("undo");

let board, turn, selected, legal, history, lastMove, gameOver, flipped, thinking, timer;
let mode = "ai", humanSide = "red", level = 2;
let kingsPos = {};

const inBoard = (r,c) => r>=0 && r<ROWS && c>=0 && c<COLS;
const enemy = c => c===R ? B : R;
const riverCrossed = (color,row) => color===R ? row<=4 : row>=5;
const inPalace = (color,r,c) => c>=3 && c<=5 && (color===R ? r>=7 : r<=2);
const same = (a,b) => a && b && a.color===b.color;

function initial(){
  const b = Array.from({length:ROWS}, () => Array(COLS).fill(null));
  const back = ["r","h","e","a","k","a","e","h","r"];
  back.forEach((kind,c) => { b[0][c] = {color:B,kind}; b[9][c] = {color:R,kind}; });
  [1,7].forEach(c => { b[2][c] = {color:B,kind:"c"}; b[7][c] = {color:R,kind:"c"}; });
  for (let c=0; c<COLS; c+=2) { b[3][c] = {color:B,kind:"p"}; b[6][c] = {color:R,kind:"p"}; }
  return b;
}
const clone = b => b.map(row => row.map(p => p ? {color:p.color, kind:p.kind} : null));

function findKing(b,color){
  const k = kingsPos[color];
  if (k && b[k[0]][k[1]] && b[k[0]][k[1]].color===color && b[k[0]][k[1]].kind==="k") return k;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const p = b[r][c];
    if (p && p.color===color && p.kind==="k"){ kingsPos[color] = [r,c]; return [r,c]; }
  }
  return null;
}

function pseudoMoves(b,r,c){
  const p = b[r][c], out = [];
  const push = (tr,tc) => {
    if (!inBoard(tr,tc)) return;
    if (same(p, b[tr][tc])) return;
    out.push({from:[r,c], to:[tr,tc]});
  };
  if (p.kind==="k"){
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc]) => { if (inPalace(p.color,r+dr,c+dc)) push(r+dr,c+dc); });
  } else if (p.kind==="a"){
    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc]) => { if (inPalace(p.color,r+dr,c+dc)) push(r+dr,c+dc); });
  } else if (p.kind==="e"){
    [[-2,-2],[-2,2],[2,-2],[2,2]].forEach(([dr,dc]) => {
      const tr = r+dr, tc = c+dc;
      if (!inBoard(tr,tc) || riverCrossed(p.color,tr)) return;
      if (!b[r+dr/2][c+dc/2]) push(tr,tc);
    });
  } else if (p.kind==="h"){
    [[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],
     [-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]].forEach(([dr,dc,br,bc]) => {
      if (!inBoard(r+dr,c+dc)) return;
      if (!b[r+br][c+bc]) push(r+dr,c+dc);
    });
  } else if (p.kind==="r"){
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc]) => {
      let tr = r+dr, tc = c+dc;
      while (inBoard(tr,tc)){
        if (!b[tr][tc]) push(tr,tc);
        else { push(tr,tc); break; }
        tr += dr; tc += dc;
      }
    });
  } else if (p.kind==="c"){
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc]) => {
      let tr = r+dr, tc = c+dc, jumped = false;
      while (inBoard(tr,tc)){
        if (!jumped){
          if (!b[tr][tc]) push(tr,tc); else jumped = true;
        } else if (b[tr][tc]) { push(tr,tc); break; }
        tr += dr; tc += dc;
      }
    });
  } else {
    const dir = p.color===R ? -1 : 1;
    push(r+dir,c);
    if (riverCrossed(p.color,r)) { push(r,c-1); push(r,c+1); }
  }
  return out;
}

function isAttacked(b,color){
  const kp = findKing(b,color);
  if (!kp) return true;
  const kr = kp[0], kc = kp[1], e = enemy(color);

  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (let i=0;i<4;i++){
    const dr = dirs[i][0], dc = dirs[i][1];
    let r = kr+dr, c = kc+dc, blockers = 0;
    while (inBoard(r,c)){
      const p = b[r][c];
      if (p){
        if (blockers===0){
          if (p.color===e && (p.kind==="r" || (p.kind==="k" && dc===0))) return true;
          if (p.color===e && p.kind==="k" && dr!==0) return true;
          blockers = 1;
        } else {
          if (p.color===e && p.kind==="c") return true;
          break;
        }
      }
      r += dr; c += dc;
    }
  }

  const horse = [[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],
                 [-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]];
  for (let i=0;i<horse.length;i++){
    const dr = horse[i][0], dc = horse[i][1], br = horse[i][2], bc = horse[i][3];
    const nr = kr-dr, nc = kc-dc;
    if (!inBoard(nr,nc)) continue;
    const p = b[nr][nc];
    const legR = nr+br, legC = nc+bc;
    if (p && p.color===e && p.kind==="h" && (!inBoard(legR,legC) || !b[legR][legC])) return true;
  }

  const pd = e===R ? -1 : 1;
  const pr = kr - pd, pc = kc;
  if (inBoard(pr,pc)){ const p = b[pr][pc]; if (p && p.color===e && p.kind==="p") return true; }
  if (inBoard(kr,kc-1)){ const p = b[kr][kc-1]; if (p && p.color===e && p.kind==="p" && riverCrossed(e,kr)) return true; }
  if (inBoard(kr,kc+1)){ const p = b[kr][kc+1]; if (p && p.color===e && p.kind==="p" && riverCrossed(e,kr)) return true; }

  return false;
}

function make(b,m){
  const fr = m.from[0], fc = m.from[1], tr = m.to[0], tc = m.to[1];
  const p = b[fr][fc];
  m.cap = b[tr][tc];
  b[tr][tc] = p; b[fr][fc] = null;
  if (p.kind==="k") kingsPos[p.color] = [tr,tc];
  return m.cap;
}

function unmake(b,m,cap){
  const fr = m.from[0], fc = m.from[1], tr = m.to[0], tc = m.to[1];
  const p = b[tr][tc];
  b[fr][fc] = p; b[tr][tc] = cap || null;
  if (p.kind==="k") kingsPos[p.color] = [fr,fc];
}

function legalMoves(r,c){
  const p = board[r][c];
  const out = [];
  const list = pseudoMoves(board,r,c);
  for (let i=0;i<list.length;i++){
    const m = list[i];
    const victim = board[m.to[0]][m.to[1]];
    if (victim && victim.kind === "k") continue;   // 老将只能被将死，不能被吃
    const cap = make(board,m);
    if (!isAttacked(board,p.color)) out.push(m);
    unmake(board,m,cap);
  }
  return out;
}

function allMoves(color){
  const out = [];
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const p = board[r][c];
    if (p && p.color===color){
      const list = legalMoves(r,c);
      for (let i=0;i<list.length;i++) out.push(list[i]);
    }
  }
  return out;
}

function evaluate(b,forColor){
  let score = 0;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const p = b[r][c];
    if (!p) continue;
    let v = VALUES[p.kind];
    if (p.kind==="p"){
      if (riverCrossed(p.color,r)) v += 45;
      if (p.color===R ? r<=3 : r>=6) v += 20;
    } else if (p.kind==="c" || p.kind==="h"){
      if (c>=2 && c<=6) v += 14;
      if (p.color===R ? r<=4 : r>=5) v += 10;
    } else if (p.kind==="r"){
      if (c>=2 && c<=6) v += 10;
    }
    score += p.color===forColor ? v : -v;
  }
  return score;
}

let deadline = 0;
let nodes = 0;
const CAP_TACTIC = {r:1000, c:700, h:600, e:200, a:150, p:80, k:0};

function mvvlva(m){
  const v = board[m.to[0]][m.to[1]];
  if (!v) return 0;
  const a = board[m.from[0]][m.from[1]];
  const gain = CAP_TACTIC[v.kind] || 0;
  const cost = a && a.kind !== "k" ? (CAP_TACTIC[a.kind] || 1)/10 : 0;
  return gain - cost;
}

function orderMoves(moves){
  moves.sort((a,b) => mvvlva(b) - mvvlva(a));
  return moves;
}

// 静止搜索：只走吃子，消除"偶数层白丢子"的抖振
function quiesce(color,alpha,beta,ply,qdepth){
  nodes++;
  const stand = evaluate(board,color);
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;
  if (qdepth <= 0 || (deadline && Date.now() > deadline)) return alpha;
  const caps = orderMoves(allMoves(color).filter(m => board[m.to[0]][m.to[1]]));
  for (let i=0;i<caps.length;i++){
    const m = caps[i];
    const cap = make(board,m);
    const v = -quiesce(enemy(color),-beta,-alpha,ply+1,qdepth-1);
    unmake(board,m,cap);
    if (v >= beta) return beta;
    if (v > alpha) alpha = v;
  }
  return alpha;
}

function search(color,depth,alpha,beta,ply){
  nodes++;
  if (depth<=0) return quiesce(color,alpha,beta,ply,4);
  const moves = orderMoves(allMoves(color));
  if (!moves.length) return -MATE + ply;
  let best = -Infinity;
  for (let i=0;i<moves.length;i++){
    const m = moves[i];
    const cap = make(board,m);
    const v = -search(enemy(color),depth-1,-beta,-alpha,ply+1);
    unmake(board,m,cap);
    if (v > best) best = v;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
    if (deadline && Date.now() > deadline) break;
  }
  return best;
}

function chooseMove(aiColor){
  const moves = orderMoves(allMoves(aiColor));
  if (!moves.length) return null;
  const maxDepth = level===1 ? 2 : level===2 ? 3 : 4;
  const budget = level===1 ? 250 : level===2 ? 900 : 2000;
  deadline = Date.now() + budget;
  nodes = 0;
  let scored = moves.map(m => ({move:m, score:0}));
  for (let depth=1; depth<=maxDepth; depth++){
    const round = [];
    for (let i=0;i<scored.length;i++){
      const m = scored[i].move;
      const cap = make(board,m);
      const v = -search(enemy(aiColor),depth-1,-Infinity,Infinity,1);
      unmake(board,m,cap);
      round.push({move:m, score:v});
      if (Date.now() > deadline && depth > 1) break;
    }
    if (Date.now() > deadline && depth > 1) break;
    round.sort((a,b) => b.score - a.score);
    scored = round;
    if (Math.abs(scored[0].score) > MATE - 100) break;
  }
  const best = scored[0].score;
  const window = level===1 ? 120 : level===2 ? 40 : 12;
  const pool = scored.filter(s => s.score >= best - window);
  const pick = pool[Math.floor(Math.random()*pool.length)];
  return pick.move;
}

function applyMove(m){
  history.push({board:clone(board), turn:turn, last:lastMove, kings:{red:kingsPos.red, black:kingsPos.black}});
  make(board,m);
  lastMove = m;
  selected = null; legal = [];
  turn = enemy(turn);
  render(); updateStatus();
  maybeAI();
}

function maybeAI(){
  clearTimeout(timer);
  if (gameOver || mode!=="ai" || turn===humanSide) return;
  thinking = true; updateStatus();
  timer = setTimeout(() => {
    const m = chooseMove(turn);
    thinking = false;
    if (!m){ updateStatus(); return; }
    applyMove(m);
  }, thinking ? 200 : 200);
}

function updateStatus(){
  const inCheck = isAttacked(board,turn);
  const moves = allMoves(turn);
  if (!moves.length){
    gameOver = true; thinking = false;
    const winner = turn===R ? "黑方" : "红方";
    const reason = inCheck ? "绝杀" : "困毙";
    statusEl.innerHTML = "<span class=\"win\">" + winner + "胜（" + reason + "）</span>";
    render();
    return;
  }
  let text = (turn===R ? "红方" : "黑方") + "走棋";
  if (inCheck) text += " <span class=\"check\">· 将军！</span>";
  if (mode==="ai") text += turn===humanSide ? "（轮到你）" : "（电脑思考中…）";
  statusEl.innerHTML = text;
}

function render(){
  piecesEl.innerHTML = "";
  for (let dr=0; dr<ROWS; dr++) for (let dc=0; dc<COLS; dc++){
    const r = flipped ? ROWS-1-dr : dr;
    const c = flipped ? COLS-1-dc : dc;
    const p = board[r][c];
    if (!p) continue;
    const el = document.createElement("div");
    el.className = "piece " + p.color;
    el.textContent = NAMES[p.color][p.kind];
    el.style.left = (X0 + dc*DX) + "%";
    el.style.top  = (Y0 + dr*DY) + "%";
    if (selected && selected[0]===r && selected[1]===c) el.classList.add("sel");
    if (lastMove && ((lastMove.from[0]===r && lastMove.from[1]===c) || (lastMove.to[0]===r && lastMove.to[1]===c))) el.classList.add("last");
    piecesEl.appendChild(el);
  }
  for (let i=0;i<legal.length;i++){
    const m = legal[i];
    const dr = flipped ? ROWS-1-m.to[0] : m.to[0];
    const dc = flipped ? COLS-1-m.to[1] : m.to[1];
    const t = board[m.to[0]][m.to[1]];
    const dot = document.createElement("div");
    dot.className = t ? "cap" : "dot";
    dot.style.left = (X0 + dc*DX) + "%";
    dot.style.top  = (Y0 + dr*DY) + "%";
    piecesEl.appendChild(dot);
  }
  drawGrid();
  sizing();
}

function drawGrid(){
  const g = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = boardEl.clientWidth || 460, h = boardEl.clientHeight || 511;
  canvas.width = w*dpr; canvas.height = h*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const x = c => (X0 + c*DX)/100 * w;
  const y = r => (Y0 + r*DY)/100 * h;
  g.strokeStyle = "#7a4a13"; g.lineWidth = 1.6; g.lineCap = "round";
  for (let r=0;r<ROWS;r++){ g.beginPath(); g.moveTo(x(0),y(r)); g.lineTo(x(8),y(r)); g.stroke(); }
  for (let c=0;c<COLS;c++){
    if (c===0 || c===8){ g.beginPath(); g.moveTo(x(c),y(0)); g.lineTo(x(c),y(9)); g.stroke(); }
    else {
      g.beginPath(); g.moveTo(x(c),y(0)); g.lineTo(x(c),y(4)); g.stroke();
      g.beginPath(); g.moveTo(x(c),y(5)); g.lineTo(x(c),y(9)); g.stroke();
    }
  }
  g.lineWidth = 1.6;
  [[0,3,2,5],[7,3,9,5]].forEach(p => {
    g.beginPath(); g.moveTo(x(p[1]),y(p[0])); g.lineTo(x(p[3]),y(p[2])); g.stroke();
    g.beginPath(); g.moveTo(x(p[3]),y(p[0])); g.lineTo(x(p[1]),y(p[2])); g.stroke();
  });
  g.strokeStyle = "#8a5a1e";
  const marks = [[2,1],[2,7],[7,1],[7,7],[3,0],[3,2],[3,4],[3,6],[3,8],[6,0],[6,2],[6,4],[6,6],[6,8]];
  const s = Math.min(w,h)*0.022;
  marks.forEach(p => {
    const cx = x(p[1]), cy = y(p[0]);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy]) => {
      if ((p[1]===0 && sx<0) || (p[1]===8 && sx>0)) return;
      g.beginPath();
      g.moveTo(cx+sx*s*0.9, cy+sy*s*1.9); g.lineTo(cx+sx*s*0.9, cy+sy*s*0.9); g.lineTo(cx+sx*s*1.9, cy+sy*s*0.9);
      g.stroke();
    });
  });
  g.fillStyle = "#96601f";
  g.font = "600 " + Math.max(13, Math.min(w,h)*0.055) + "px \"KaiTi\", \"Microsoft YaHei\", serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("楚 河", x(1.8), y(4.5));
  g.fillText("漢 界", x(6.2), y(4.5));
}

function sizing(){
  const w = boardEl.clientWidth || 460;
  piecesEl.style.fontSize = (w*0.062) + "px";
}

// 屏幕坐标 -> 棋盘行列（取最近交叉点，超出半格则忽略）
function pointToCell(clientX,clientY){
  const rect = boardEl.getBoundingClientRect();
  const px = (clientX - rect.left) / rect.width * 100;
  const py = (clientY - rect.top) / rect.height * 100;
  const dc = Math.round((px - X0) / DX);
  const dr = Math.round((py - Y0) / DY);
  if (dc < 0 || dc >= COLS || dr < 0 || dr >= ROWS) return null;
  if (Math.abs(px - (X0 + dc*DX)) > DX*0.55) return null;
  if (Math.abs(py - (Y0 + dr*DY)) > DY*0.55) return null;
  return flipped ? [ROWS-1-dr, COLS-1-dc] : [dr, dc];
}

function click(r,c){
  if (gameOver || thinking) return;
  if (mode==="ai" && turn!==humanSide) return;
  const p = board[r][c];
  if (selected){
    for (let i=0;i<legal.length;i++){
      const m = legal[i];
      if (m.to[0]===r && m.to[1]===c){ applyMove(m); return; }
    }
  }
  if (p && p.color===turn){ selected = [r,c]; legal = legalMoves(r,c); render(); }
  else { selected = null; legal = []; render(); }
}

function newGame(){
  clearTimeout(timer); thinking = false;
  board = initial();
  kingsPos = {red:[9,4], black:[0,4]};
  turn = R; selected = null; legal = []; history = []; lastMove = null; gameOver = false;
  flipped = mode==="ai" && humanSide===B;
  render(); updateStatus();
  maybeAI();
}

function undo(){
  clearTimeout(timer); thinking = false;
  if (gameOver && !history.length) return;
  const steps = mode==="ai" ? Math.min(2, history.length) : 1;
  for (let i=0;i<steps;i++){
    const h = history.pop();
    if (!h) break;
    board = h.board; turn = h.turn; lastMove = h.last;
    kingsPos = {red:h.kings.red, black:h.kings.black};
  }
  selected = null; legal = []; gameOver = false;
  render(); updateStatus();
  if (mode==="ai" && turn!==humanSide) maybeAI();
}

function flip(){
  flipped = !flipped;
  render();
}

function setSeg(id, attr, value){
  const box = document.getElementById(id);
  Array.prototype.forEach.call(box.children, btn => {
    btn.classList.toggle("on", btn.getAttribute(attr)===value);
  });
}

document.getElementById("mode").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.getAttribute("data-m");
  setSeg("mode","data-m",mode);
  newGame();
});
document.getElementById("side").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  humanSide = b.getAttribute("data-s");
  setSeg("side","data-s",humanSide);
  newGame();
});
document.getElementById("level").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  level = Number(b.getAttribute("data-l"));
  setSeg("level","data-l",String(level));
});
undoBtn.addEventListener("click", undo);
document.getElementById("new").addEventListener("click", newGame);
document.getElementById("flip").addEventListener("click", flip);
boardEl.addEventListener("click", ev => {
  const cell = pointToCell(ev.clientX, ev.clientY);
  if (cell) click(cell[0], cell[1]);
});

document.addEventListener("keydown", e => {
  if (e.key===" "){ e.preventDefault(); newGame(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
});
window.addEventListener("resize", () => { drawGrid(); sizing(); });

newGame();
})();
</script>
